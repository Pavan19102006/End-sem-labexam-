spring.application.name=jwt-generator
server.port=${PORT:8080}
# Empty default generates a fresh random 256-bit key on each startup.
# For a stable key, set JWT_SECRET_BASE64 to Base64-encoded random bytes (32+ bytes).
jwt.secret-base64=${JWT_SECRET_BASE64:}
jwt.expiration-seconds=3600
springdoc.swagger-ui.path=/swagger-ui.html
server.error.include-message=never
